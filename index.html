<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML5 Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        main {
            background: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a starter HTML5 template. You can modify this code to build your own webpage.</p>
        
        <h3>Key Features:</h3>
        <ul>
            <li>Clean and structured semantic layout</li>
            <li>Responsive viewport for mobile devices</li>
            <li>Basic embedded CSS styling</li>
        </ul>
    </main>

</body>
</html>
